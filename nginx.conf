server {
    listen 80;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;   # FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8501/;   # Streamlit
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
