server {
    listen 80 default_server;
    server_name _;

    # Allow larger uploads if needed
    client_max_body_size 20M;

    # FastAPI backend exposed via uvicorn on port 8000 inside the container
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;  # FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support websockets and HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Streamlit UI
    location / {
        proxy_pass http://127.0.0.1:8501/;  # Streamlit
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for websocket upgrades (Streamlit uses websockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for live events
        proxy_buffering off;

        # Timeouts for long-polling / streaming
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
